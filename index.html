<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Qur'an Digital - Rasm Utsmani</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap');

        :root {
            --paper-bg: #fdfaf6;
            --paper-border: #d4c4a8;
            --text-color: #2c3e50;
            --header-bg: #e8dbbf;
            --accent-color: #b5985a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eae1d0;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .controls {
            margin-top: 10px;
            margin-bottom: 20px;
            background: #ffffff;
            padding: 12px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: center;
            position: sticky;
            top: 10px;
            z-index: 100;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        button:hover:not(:disabled) { 
            background-color: #9a7d46; 
            transform: translateY(-2px);
        }
        
        button:disabled { 
            background-color: #cccccc; 
            cursor: not-allowed; 
            box-shadow: none;
        }

        .page-indicator {
            font-size: 16px;
            font-weight: 600;
            color: #444;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="number"] {
            width: 50px;
            padding: 8px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid var(--paper-border);
            border-radius: 8px;
            background-color: #f9f9f9;
        }

        /* Container Halaman */
        .quran-page {
            width: 100%;
            max-width: 550px; /* Ukuran proporsional mushaf */
            background-color: var(--paper-bg);
            padding: 25px 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-radius: 4px;
            border: 1px solid var(--paper-border);
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Teks ada di tengah vertikal */
            box-sizing: border-box;
            transition: all 0.4s ease;
        }

        /* Border Khusus Halaman 1 dan 2 (Al-Fatihah & Awal Al-Baqarah) */
        .special-border {
            border: 20px solid transparent;
            border-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect x="5" y="5" width="90" height="90" fill="none" stroke="%23b5985a" stroke-width="2"/><rect x="10" y="10" width="80" height="80" fill="none" stroke="%23b5985a" stroke-width="4"/><circle cx="10" cy="10" r="5" fill="%23b5985a"/><circle cx="90" cy="10" r="5" fill="%23b5985a"/><circle cx="10" cy="90" r="5" fill="%23b5985a"/><circle cx="90" cy="90" r="5" fill="%23b5985a"/></svg>') 20 stretch;
            padding: 40px 30px;
            background-color: #fdfaf6;
            box-shadow: inset 0 0 20px rgba(181, 152, 90, 0.1);
        }

        .quran-line {
            font-family: 'Amiri Quran', serif;
            font-size: clamp(22px, 4vw, 28px); /* Responsif terhadap layar */
            text-align: justify;
            text-align-last: justify; /* MEMBUAT TEKS RATA KIRI-KANAN PENUH */
            direction: rtl;
            line-height: 1.9;
            color: var(--text-color);
            margin: 0;
            padding: 0;
            width: 100%;
        }

        /* Baris terakhir ayat di halaman biasanya tidak dipaksa rata penuh jika tidak sampai ujung */
        .quran-line.last-line {
            text-align-last: center; 
        }

        .surah-header {
            font-family: 'Amiri Quran', serif;
            text-align: center;
            text-align-last: center;
            background: linear-gradient(90deg, transparent, var(--header-bg), transparent);
            margin: 15px 0;
            padding: 8px;
            font-size: clamp(20px, 3.5vw, 24px);
            border-top: 2px solid var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
            color: #3e321b;
        }

        .bismillah-header {
            text-align: center;
            text-align-last: center;
            font-family: 'Amiri Quran', serif;
            font-size: clamp(22px, 4vw, 26px);
            margin-bottom: 10px;
            color: var(--text-color);
        }

        .loading {
            font-size: 18px;
            color: #555;
            margin-top: 50px;
            background: white;
            padding: 20px 40px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        @media (max-width: 600px) {
            .quran-page {
                padding: 15px;
                border-image-width: 10px;
            }
            .special-border {
                padding: 30px 15px;
            }
            .controls {
                width: 90%;
                gap: 10px;
                padding: 10px;
            }
            button {
                padding: 8px 12px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="controls">
        <button id="prevBtn" onclick="changePage(-1)">&#9664; Seb</button>
        <div class="page-indicator">
            Hal. <input type="number" id="pageInput" min="1" value="1" onchange="jumpToPage()"> / <span id="totalPages">...</span>
        </div>
        <button id="nextBtn" onclick="changePage(1)">Sel &#9654;</button>
    </div>

    <div id="loading" class="loading">Memuat dataset Al-Qur'an...</div>

    <div id="quranContainer" class="quran-page" style="display: none;">
        <!-- Teks dirender di sini -->
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script>
        let quranLines = [];
        let pageMap = {}; // Format: { 1: [ baris... ], 2: [ baris... ] }
        let currentPage = 1;
        let maxPage = 1;

        const arabicNumbersRegex = /[\u0660-\u0669]/g; 

        async function loadData() {
            try {
                // Mengambil data dari quranbylines.csv
                const quranRes = await fetch('quranbylines.csv');
                const quranText = await quranRes.text();
                Papa.parse(quranText, {
                    complete: function(results) {
                        // Membuang baris kosong
                        quranLines = results.data.filter(row => row && row.length >= 4 && row[3].trim() !== '');
                        processPagesByLineCount();
                    }
                });

            } catch (error) {
                document.getElementById('loading').innerText = "Gagal memuat. Pastikan quranbylines.csv ada dan jalankan via Live Server.";
                console.error(error);
            }
        }

        function processPagesByLineCount() {
            let pageNum = 1;
            let currentLineCount = 0;
            let targetLines = 8; // Halaman 1 targetnya 8 baris

            pageMap[pageNum] = [];

            for (let i = 0; i < quranLines.length; i++) {
                const row = quranLines[i];
                const text = row[3];
                
                // Deteksi tipe baris
                const isHeader = text.includes('سُورَةُ') && !text.match(arabicNumbersRegex);
                const isBismillah = text.includes('بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ') && !text.match(arabicNumbersRegex);

                pageMap[pageNum].push({
                    text: text,
                    isHeader: isHeader,
                    isBismillah: isBismillah
                });

                currentLineCount++;

                // Jika jumlah baris sudah mencapai target untuk halaman ini
                if (currentLineCount >= targetLines) {
                    pageNum++;
                    pageMap[pageNum] = [];
                    currentLineCount = 0;

                    // Atur target baris untuk halaman berikutnya
                    if (pageNum === 2) {
                        targetLines = 8; // Halaman 2 juga 8 baris
                    } else {
                        targetLines = 15; // Halaman 3 dan seterusnya 15 baris
                    }
                }
            }

            // Hapus halaman terakhir jika kebetulan kosong karena pembagian
            if (pageMap[pageNum].length === 0) {
                delete pageMap[pageNum];
                maxPage = pageNum - 1;
            } else {
                maxPage = pageNum;
            }

            document.getElementById('totalPages').innerText = maxPage;
            document.getElementById('pageInput').max = maxPage;

            document.getElementById('loading').style.display = 'none';
            document.getElementById('quranContainer').style.display = 'flex';
            renderPage(1);
        }

        function renderPage(pageNum) {
            currentPage = pageNum;
            document.getElementById('pageInput').value = pageNum;
            
            const container = document.getElementById('quranContainer');
            container.innerHTML = '';

            // Terapkan border cantik khusus halaman 1 dan 2
            if (pageNum === 1 || pageNum === 2) {
                container.classList.add('special-border');
            } else {
                container.classList.remove('special-border');
            }

            const lines = pageMap[pageNum];
            if (!lines) return;

            lines.forEach((lineData, index) => {
                const div = document.createElement('div');
                div.className = 'quran-line';
                
                if (lineData.isHeader) {
                    div.className = 'surah-header';
                } else if (lineData.isBismillah) {
                    div.className = 'bismillah-header';
                }

                // Menangani baris terakhir di halaman agar tidak justify jika terlalu pendek
                if (index === lines.length - 1 && !lineData.isHeader && !lineData.isBismillah) {
                    div.classList.add('last-line');
                }

                // Membersihkan angka nol di awal teks (jika ada dari dataset)
                let finalText = lineData.text.replace(/^٠/, '').trim(); 
                div.innerText = finalText;
                container.appendChild(div);
            });

            // Kontrol tombol navigasi
            document.getElementById('prevBtn').disabled = (pageNum === 1);
            document.getElementById('nextBtn').disabled = (pageNum === maxPage);
        }

        function changePage(delta) {
            let newPage = currentPage + delta;
            if (newPage >= 1 && newPage <= maxPage) {
                renderPage(newPage);
            }
        }

        function jumpToPage() {
            let input = parseInt(document.getElementById('pageInput').value);
            if (input >= 1 && input <= maxPage) {
                renderPage(input);
            } else {
                document.getElementById('pageInput').value = currentPage; 
            }
        }

        window.onload = loadData;
    </script>
</body>
</html>

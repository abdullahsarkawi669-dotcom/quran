<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Qur'an Digital - Rasm Utsmani</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap');

        :root {
            --paper-bg: #fdfaf6;
            --paper-border: #d4c4a8;
            --text-color: #2c3e50;
            --header-bg: #e8dbbf;
            --accent-color: #b5985a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eae1d0;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .controls {
            margin-top: 10px;
            margin-bottom: 20px;
            background: #ffffff;
            padding: 12px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: center;
            position: sticky;
            top: 10px;
            z-index: 100;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        button:hover:not(:disabled) { 
            background-color: #9a7d46; 
            transform: translateY(-2px);
        }
        
        button:disabled { 
            background-color: #cccccc; 
            cursor: not-allowed; 
        }

        input[type="number"] {
            width: 50px;
            padding: 8px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid var(--paper-border);
            border-radius: 8px;
            background-color: #f9f9f9;
        }

        /* Container Halaman (Kertas) */
        .quran-page {
            width: 100%;
            max-width: 600px;
            background-color: var(--paper-bg);
            padding: 30px 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-radius: 4px;
            border: 1px solid var(--paper-border);
            
            /* Tinggi minimum dibuat proporsional dan Flexbox digunakan agar baris menyebar rata (space-between) */
            min-height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Border Khusus Halaman 1 dan 2 */
        .special-border {
            border: 20px solid transparent;
            border-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect x="5" y="5" width="90" height="90" fill="none" stroke="%23b5985a" stroke-width="2"/><rect x="10" y="10" width="80" height="80" fill="none" stroke="%23b5985a" stroke-width="4"/><circle cx="10" cy="10" r="5" fill="%23b5985a"/><circle cx="90" cy="10" r="5" fill="%23b5985a"/><circle cx="10" cy="90" r="5" fill="%23b5985a"/><circle cx="90" cy="90" r="5" fill="%23b5985a"/></svg>') 20 stretch;
            padding: 50px 35px;
            background-color: #fdfaf6;
            box-shadow: inset 0 0 20px rgba(181, 152, 90, 0.1);
        }

        /* Kontainer untuk setiap baris agar bisa diukur ukurannya */
        .quran-line-container {
            width: 100%;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        /* Teks dalam baris */
        .quran-line-text {
            font-family: 'Amiri Quran', serif;
            font-size: clamp(24px, 4.5vw, 30px);
            text-align-last: justify;
            direction: rtl;
            color: var(--text-color);
            width: 100%;
            white-space: nowrap; /* Memaksa teks tidak turun ke baris baru */
            transform-origin: center; /* Pusat pengecilan saat teks kepanjangan */
        }

        /* Pengecualian rata penuh untuk baris paling akhir */
        .last-line {
            text-align-last: center; 
        }

        /* Header Nama Surah */
        .surah-header {
            font-family: 'Amiri Quran', serif;
            text-align: center;
            background: linear-gradient(90deg, transparent, var(--header-bg), transparent);
            padding: 5px;
            font-size: clamp(22px, 4vw, 26px);
            border-top: 2px solid var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
            color: #3e321b;
            width: 100%;
        }

        /* Desain Khusus Bismillah (Tengah dengan Border Kiri Kanan) */
        .bismillah-header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin: 5px 0;
            direction: rtl;
        }

        .bismillah-text {
            font-family: 'Amiri Quran', serif;
            font-size: clamp(22px, 4vw, 26px);
            color: var(--text-color);
            padding: 0 15px;
            border-left: 2px solid var(--accent-color);
            border-right: 2px solid var(--accent-color);
            white-space: nowrap;
        }

        /* Garis memanjang di samping bismillah */
        .bismillah-header-container::before, 
        .bismillah-header-container::after {
            content: "";
            flex-grow: 1;
            height: 1.5px;
            background-color: var(--accent-color);
            opacity: 0.4;
        }

        .loading {
            font-size: 18px;
            color: #555;
            margin-top: 50px;
            background: white;
            padding: 20px 40px;
            border-radius: 30px;
        }

        @media (max-width: 600px) {
            .quran-page {
                padding: 20px 15px;
                border-image-width: 15px;
                min-height: 80vh;
            }
            .special-border { padding: 35px 15px; }
        }
    </style>
</head>
<body>

    <div class="controls">
        <button id="prevBtn" onclick="changePage(-1)">&#9664; Seb</button>
        <div style="font-size: 16px; font-weight: bold; color: #444;">
            Hal. <input type="number" id="pageInput" min="1" value="1" onchange="jumpToPage()"> / <span id="totalPages">...</span>
        </div>
        <button id="nextBtn" onclick="changePage(1)">Sel &#9654;</button>
    </div>

    <div id="loading" class="loading">Memuat dataset Al-Qur'an...</div>
    <div id="quranContainer" class="quran-page" style="display: none;"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script>
        let quranLines = [];
        let pageMap = {}; 
        let currentPage = 1;
        let maxPage = 1;
        const arabicNumbersRegex = /[\u0660-\u0669]/g; 

        async function loadData() {
            try {
                const quranRes = await fetch('quranbylines.csv');
                const quranText = await quranRes.text();
                Papa.parse(quranText, {
                    complete: function(results) {
                        quranLines = results.data.filter(row => row && row.length >= 4 && row[3].trim() !== '');
                        processPagesByLineCount();
                    }
                });
            } catch (error) {
                document.getElementById('loading').innerText = "Gagal memuat. Pastikan quranbylines_2.csv ada.";
                console.error(error);
            }
        }

        function processPagesByLineCount() {
            let pageNum = 1;
            let currentLineCount = 0;
            let targetLines = 8; 

            pageMap[pageNum] = [];

            for (let i = 0; i < quranLines.length; i++) {
                const text = quranLines[i][3];
                const isHeader = text.includes('سُورَةُ') && !text.match(arabicNumbersRegex);
                const isBismillah = text.includes('بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ') && !text.match(arabicNumbersRegex);

                pageMap[pageNum].push({ text, isHeader, isBismillah });
                currentLineCount++;

                if (currentLineCount >= targetLines) {
                    pageNum++;
                    pageMap[pageNum] = [];
                    currentLineCount = 0;
                    targetLines = (pageNum === 2) ? 8 : 15;
                }
            }

            if (pageMap[pageNum].length === 0) delete pageMap[pageNum];
            maxPage = Object.keys(pageMap).length;
            
            document.getElementById('totalPages').innerText = maxPage;
            document.getElementById('pageInput').max = maxPage;
            document.getElementById('loading').style.display = 'none';
            document.getElementById('quranContainer').style.display = 'flex';
            
            renderPage(1);
        }

        function renderPage(pageNum) {
            currentPage = pageNum;
            document.getElementById('pageInput').value = pageNum;
            const container = document.getElementById('quranContainer');
            container.innerHTML = '';

            // Set background border islami
            if (pageNum === 1 || pageNum === 2) {
                container.classList.add('special-border');
            } else {
                container.classList.remove('special-border');
            }

            const lines = pageMap[pageNum];
            if (!lines) return;

            lines.forEach((lineData, index) => {
                let finalText = lineData.text.replace(/^٠/, '').trim(); 
                
                if (lineData.isHeader) {
                    const div = document.createElement('div');
                    div.className = 'surah-header';
                    div.innerText = finalText;
                    container.appendChild(div);
                } 
                else if (lineData.isBismillah) {
                    // Struktur Bismillah yang terkurung border
                    const flexCont = document.createElement('div');
                    flexCont.className = 'bismillah-header-container';
                    const span = document.createElement('span');
                    span.className = 'bismillah-text';
                    span.innerText = finalText;
                    flexCont.appendChild(span);
                    container.appendChild(flexCont);
                } 
                else {
                    // Baris Teks Ayat Standar
                    const cont = document.createElement('div');
                    cont.className = 'quran-line-container';
                    
                    const textDiv = document.createElement('div');
                    textDiv.className = 'quran-line-text';
                    
                    // Pengecualian rata tengah untuk baris terakhir jika tidak penuh
                    if (index === lines.length - 1) textDiv.classList.add('last-line');
                    
                    textDiv.innerText = finalText;
                    cont.appendChild(textDiv);
                    container.appendChild(cont);
                }
            });

            document.getElementById('prevBtn').disabled = (pageNum === 1);
            document.getElementById('nextBtn').disabled = (pageNum === maxPage);

            // Tunda sebentar untuk mengizinkan CSS merender, lalu kecilkan (kompres) teks yang kepanjangan
            setTimeout(fitLongText, 50);
        }

        // FUNGSI KOMPRESI TEKS (Menyempitkan teks yang kepanjangan agar muat 1 baris)
        function fitLongText() {
            const lines = document.querySelectorAll('.quran-line-text');
            lines.forEach(textDiv => {
                // Reset transform
                textDiv.style.transform = 'none';
                
                const scrollW = textDiv.scrollWidth;
                const clientW = textDiv.clientWidth;
                
                // Jika lebar asli teks lebih besar daripada ruang yang tersedia di layar
                if (scrollW > clientW && clientW > 0) {
                    const ratio = clientW / scrollW;
                    // Sempitkan skala horizontalnya persis sebesar kelebihan lebarnya
                    textDiv.style.transform = `scaleX(${ratio - 0.01})`; 
                }
            });
        }

        // Jalankan fungsi fitLongText saat ukuran layar (window) diubah orientasinya / di-resize
        window.addEventListener('resize', () => {
            setTimeout(fitLongText, 100);
        });

        function changePage(delta) {
            let newPage = currentPage + delta;
            if (newPage >= 1 && newPage <= maxPage) renderPage(newPage);
        }

        function jumpToPage() {
            let input = parseInt(document.getElementById('pageInput').value);
            if (input >= 1 && input <= maxPage) {
                renderPage(input);
            } else {
                document.getElementById('pageInput').value = currentPage; 
            }
        }

        window.onload = loadData;
    </script>
</body>
</html>
